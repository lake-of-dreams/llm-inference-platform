name: ci
on: [push, pull_request]

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: go build ./...
      - run: go vet ./...
      - run: test -z "$(gofmt -l .)"
      # The CRD, ClusterRole and DeepCopy code are generated from the Go
      # source. This fails when someone edits one without regenerating.
      - run: make check-generated
      # Starts a real kube-apiserver and etcd, so server-side apply, field
      # ownership and the CRD's CEL rules are exercised for real.
      - run: make test-go

  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: pytest

  manifests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      # kubectl --dry-run=client still fetches the OpenAPI schema from a live
      # server, so it cannot run here. kubeconform validates offline.
      - run: make validate
