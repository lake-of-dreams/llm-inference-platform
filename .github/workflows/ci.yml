name: ci
on: [push, pull_request]

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26"
      - run: go build ./...
      - run: go vet ./...
      - run: test -z "$(gofmt -l .)"

  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: pytest

  manifests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # kubectl --dry-run=client still fetches the OpenAPI schema from a live
      # server, so it cannot run here. kubeconform validates offline.
      - name: install kubeconform
        run: |
          curl -sSLo /tmp/kubeconform.tar.gz \
            https://github.com/yannh/kubeconform/releases/download/v0.7.0/kubeconform-linux-amd64.tar.gz
          tar -xzf /tmp/kubeconform.tar.gz -C /tmp
          sudo mv /tmp/kubeconform /usr/local/bin/
      - name: validate manifests
        run: |
          kubeconform -strict -summary \
            -kubernetes-version 1.34.0 \
            -ignore-missing-schemas \
            config/crd config/dra config/keda
