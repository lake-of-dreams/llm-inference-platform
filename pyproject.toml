[project]
name = "model-gateway"
version = "0.1.0"
description = "Cost- and capability-aware routing across LLM backends"
requires-python = ">=3.12"

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "gateway"}
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["gateway/tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RET", "ARG", "PTH"]
ignore = ["E501"]
