# Leader election keeps a single active operator when more than one replica
# runs. The lock is a Lease in the operator's own namespace.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: inference-operator-leader-election
  namespace: inference-system
rules:
  - apiGroups: [coordination.k8s.io]
    resources: [leases]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [""]
    resources: [events]
    verbs: [create, patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: inference-operator-leader-election
  namespace: inference-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: inference-operator-leader-election
subjects:
  - kind: ServiceAccount
    name: inference-operator
    namespace: inference-system
