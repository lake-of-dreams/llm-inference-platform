apiVersion: v1
kind: Namespace
metadata:
  name: inference-system
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: inference-operator
  namespace: inference-system
  labels:
    app.kubernetes.io/name: inference-operator
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: inference-operator
  template:
    metadata:
      labels:
        app.kubernetes.io/name: inference-operator
    spec:
      serviceAccountName: inference-operator
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: operator
          # `make deploy` builds this tag and loads it into the kind cluster.
          image: inference-operator:dev
          imagePullPolicy: IfNotPresent
          args:
            - --prometheus-address=http://prometheus.monitoring.svc.cluster.local:9090
          ports:
            - name: metrics
              containerPort: 8080
            - name: probes
              containerPort: 8081
          livenessProbe:
            httpGet: {path: /healthz, port: probes}
          readinessProbe:
            httpGet: {path: /readyz, port: probes}
          resources:
            requests: {cpu: 50m, memory: 64Mi}
            limits: {memory: 256Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
