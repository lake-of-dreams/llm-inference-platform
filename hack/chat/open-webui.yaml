# A chat window for the models the operator serves. Open WebUI is an
# open-source chat interface; here it is pointed at the two InferenceServices
# through their OpenAI-compatible APIs, so the model menu lists both.
#
#   http://chat.172.18.255.200.nip.io     (after `make routes`)
#
# No sign-in and no saved history: conversations live in the pod's scratch
# volume and go when it restarts. For a laptop cluster.
apiVersion: v1
kind: Namespace
metadata: {name: chat}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: open-webui, namespace: chat, labels: {app: open-webui}}
spec:
  replicas: 1
  selector: {matchLabels: {app: open-webui}}
  template:
    metadata: {labels: {app: open-webui}}
    spec:
      containers:
        - name: open-webui
          image: ghcr.io/open-webui/open-webui:v0.13.3
          ports: [{name: http, containerPort: 8080}]
          env:
            - {name: WEBUI_AUTH, value: "False"}
            # Both services speak the OpenAI API on port 8000: vLLM natively,
            # Ollama through its /v1 compatibility layer.
            - name: OPENAI_API_BASE_URLS
              value: "http://qwen-small.llm-platform.svc.cluster.local:8000/v1;http://phi4-mini-meter.llm-platform.svc.cluster.local:8000/v1"
            - {name: OPENAI_API_KEYS, value: "none;none"}
            - {name: ENABLE_OLLAMA_API, value: "False"}
            # Nothing here needs the public internet once the image is pulled.
            - {name: OFFLINE_MODE, value: "True"}
            - {name: ENABLE_TITLE_GENERATION, value: "False"}
            - {name: ENABLE_TAGS_GENERATION, value: "False"}
            - {name: ENABLE_FOLLOW_UP_GENERATION, value: "False"}
            - {name: DEFAULT_MODELS, value: "qwen-small"}
            # Open WebUI's built-in tools (memory, notes, calendar, code
            # interpreter and others) are attached to every message as tool
            # definitions. A small model on a CPU then spends its time reading
            # tool schemas, and Ollama holds the whole answer back while it
            # looks for a tool call: a one-line question took 90 seconds and
            # showed nothing until the end. This is a plain chat window.
            # The switches below turn features off. This one stops the rest of the
            # built-in tools (time, files, knowledge search) being attached to
            # every message: their definitions alone were over 2,000 tokens, more
            # than a small model's whole context, so "what is the time" was
            # refused as too long.
            - name: DEFAULT_MODEL_METADATA
              value: '{"capabilities": {"builtin_tools": false}}'
            - {name: ENABLE_MEMORIES, value: "False"}
            - {name: ENABLE_CODE_INTERPRETER, value: "False"}
            - {name: ENABLE_CODE_EXECUTION, value: "False"}
            - {name: ENABLE_NOTES, value: "False"}
            - {name: ENABLE_CALENDAR, value: "False"}
            - {name: ENABLE_AUTOMATIONS, value: "False"}
            - {name: ENABLE_CHANNELS, value: "False"}
            - {name: ENABLE_SUBAGENTS, value: "False"}
            - {name: ENABLE_APPS, value: "False"}
            - {name: ENABLE_WEB_SEARCH, value: "False"}
            - {name: ENABLE_IMAGE_GENERATION, value: "False"}
            - {name: ENABLE_AUTOCOMPLETE_GENERATION, value: "False"}
            - {name: ENABLE_SEARCH_QUERY_GENERATION, value: "False"}
            - {name: ENABLE_RETRIEVAL_QUERY_GENERATION, value: "False"}
          readinessProbe:
            httpGet: {path: /health, port: http}
            periodSeconds: 5
            failureThreshold: 60
          resources:
            requests: {cpu: 100m, memory: 512Mi}
          volumeMounts: [{name: data, mountPath: /app/backend/data}]
      volumes: [{name: data, emptyDir: {}}]
---
apiVersion: v1
kind: Service
metadata: {name: open-webui, namespace: chat}
spec:
  selector: {app: open-webui}
  ports: [{name: http, port: 80, targetPort: http}]
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata: {name: chat, namespace: chat}
spec:
  parentRefs: [{name: local, namespace: gateway}]
  hostnames: [chat.172.18.255.200.nip.io]
  rules:
    - backendRefs: [{name: open-webui, port: 80}]
      timeouts: {request: 0s}
