# kind config template for nvkind: one control-plane node and one worker that
# is given every GPU on the host. The /dev/null mount is nvkind's signal to
# the NVIDIA container runtime: "inject all GPUs into this node".
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
nodes:
- role: control-plane
- role: worker
  extraMounts:
  - hostPath: /dev/null
    containerPath: /var/run/nvidia-container-devices/all
