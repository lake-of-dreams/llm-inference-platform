# Grafana for a laptop cluster reached through `kubectl port-forward`. Anyone
# who can reach the port is an admin, with no sign-in. Do not copy this to a
# cluster other people can reach.
adminPassword: admin
grafana.ini:
  auth.anonymous: {enabled: true, org_role: Admin}
  auth: {disable_login_form: true}
  dashboards: {default_home_dashboard_path: /tmp/dashboards/dashboard-activity.json}
datasources:
  datasources.yaml:
    apiVersion: 1
    datasources:
      - {name: Prometheus, uid: prometheus, type: prometheus, access: proxy, isDefault: true,
         url: "http://prometheus.monitoring.svc.cluster.local:9090"}
      - {name: Tempo, uid: tempo, type: tempo, access: proxy,
         url: "http://tempo.monitoring.svc.cluster.local:3200"}
sidecar:
  dashboards: {enabled: true, label: grafana_dashboard, searchNamespace: monitoring}
dashboardProviders:
  dashboardproviders.yaml:
    apiVersion: 1
    providers:
      - {name: community, orgId: 1, folder: Community, type: file, disableDeletion: false,
         options: {path: /var/lib/grafana/dashboards/community}}
dashboards:
  community:
    node-exporter-full: {gnetId: 1860, datasource: Prometheus}
    kubernetes-pods: {gnetId: 15760, datasource: Prometheus}
persistence: {enabled: false}
